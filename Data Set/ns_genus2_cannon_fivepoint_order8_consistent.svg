<text x="900" y="82" text-anchor="middle" class="small">No channel matching imposed; Q_L = Z_Liouville / Z_free-superfield^9</text>
<text x="900" y="112" text-anchor="middle" class="tiny">Fixed-marking theta Liouville numerator and both free denominators freshly evaluated; unaffected glasses numerator preserved</text>
